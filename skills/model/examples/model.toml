# Declares how this project's documents express a model. Nothing here is built in.

[model]
node_id_attrs = ["node_id"]
edge_id_attr  = "edge_id"
group_attr    = "group"
kind_attr     = "kind"
# Optional. Where a participation step's Uses finds the participating pattern, what its id looks like,
# and which front matter statuses the approval gate counts as approved.
# patterns_root     = "patterns"
# pattern_id        = '[A-Z]{2,5}-[0-9]{3}'
# approved_statuses = ["Final", "Approved", "Active", "Published"]

[[markdown.tables]]
section    = "Components"
entity     = "node"
id_pattern = "(SVC|EXT)-[0-9]{2}"
columns    = { id = "Component", label = "Component", group = "Zone" }

[[markdown.tables]]
section    = "Interfaces"
entity     = "edge"
id_pattern = "(IF-[0-9]{2}|SVC-[0-9]{2}|EXT-[0-9]{2})"
columns    = { id = "Interface", source = "Provider", consumer = "Consumer", target = "Consumer", label = "Purpose" }

[markdown.scenarios]
section = "Scenarios"
columns = { step = "Step", actor = "Actor", action = "Action", edge = "Interface", target = "Target", uses = "Uses" }

# Optional. Identifiers are checked against these, and `level` feeds the derived
# abstraction that `validate` reports: conceptual, logical, physical or mixed.
# [[catalogues]]
# path   = "catalogue/services.csv"
# column = "id"
# level  = "physical"

# Optional. A declared identifier links to its page, in the walkthrough and in draw.io.
# link_site and link_target ("new" or "same") go under [model]; rules are tried in order.
# [[links]]
# match  = '(SVC|EXT)-[0-9]{2}'
# locate = "services/*/{id}-*"          # {located}: the match relative to "services"
# href   = "https://example.org/services/{located}/"

# [style]
# region = "rounded=1;dashed=1;fillColor=none;strokeColor=#5B6474;"   # participating patterns' regions

[rules]
node_id_mismatch = "warn"
