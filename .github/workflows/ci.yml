name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  skills:
    name: Agent Skills validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Zero-dependency on purpose, so this job needs no install step.
      - name: Validate skills against the agentskills.io spec
        run: node scripts/validate-skills.mjs skills
      - name: Validate bundle.json against the bundle schema and the skills
        run: node scripts/validate-bundle.mjs .
      # An installer runs each skill's check after installing it; this runs it the same way.
      - name: The post-install check passes in an empty workspace
        run: mkdir -p /tmp/ws && node scripts/validate-bundle.mjs --run-checks /tmp/ws --skills skills .

  model:
    name: model tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # model's YAML support is optional; the tests cover it.
      - name: Install
        run: python -m pip install pyyaml
      - name: Test
        run: python -m unittest discover -s skills/model/tests

  versions:
    name: Each skill's versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SKILL.md, pyproject.toml, __init__.py and the marketplace entry agree, per skill
        run: |
          fail=0
          for d in skills/*/; do
            name=$(basename "$d")
            skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' "$d/SKILL.md")
            market=$(node -p "(require('./.claude-plugin/marketplace.json').plugins.find(p => p.name === '$name') || {}).version")
            echo "$name: SKILL.md $skill, marketplace.json $market"
            [ "$skill" = "$market" ] || fail=1
          done
          skill=$(sed -n 's/^  version: "\(.*\)"/\1/p' skills/model/SKILL.md)
          py=$(sed -n 's/^version = "\(.*\)"/\1/p' skills/model/pyproject.toml)
          init=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' skills/model/src/model/__init__.py)
          echo "model: pyproject $py, __init__ $init"; [ "$py" = "$skill" ] && [ "$init" = "$skill" ] || fail=1
          exit $fail

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fsfe/reuse-action@v6

  skills-ref:
    name: Agent Skills reference validator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # skills-ref is the reference validator the Agent Skills specification names
      # (https://agentskills.io/specification#validation). It is pinned to a commit,
      # so a change upstream cannot turn this job red on its own.
      - name: Install skills-ref
        run: python -m pip install "git+https://github.com/agentskills/agentskills@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: skills-ref validate, per skill
        run: |
          fail=0
          for d in skills/*/; do
            skills-ref validate "$d" || fail=1
          done
          exit $fail
      # The specification recommends a SKILL.md under 500 lines and a body under
      # 5,000 tokens, with detail moved to files the body links. skills-ref checks
      # neither, so this does, estimating tokens as characters divided by four.
      - name: SKILL.md within the specification's size guidance
        run: |
          python - <<'PY'
          import pathlib, sys
          fail = False
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = f.read_text(encoding="utf-8")
              body = text.split("---", 2)[2]
              lines, tokens = len(text.splitlines()), len(body) // 4
              ok = lines <= 500 and tokens <= 5000
              print(f"{'ok' if ok else 'FAIL'} {f}: {lines} lines, about {tokens} body tokens")
              fail |= not ok
          sys.exit(1 if fail else 0)
          PY
